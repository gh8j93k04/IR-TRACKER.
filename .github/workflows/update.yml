name: Daily Stock Data Update

on:
  schedule:
    - cron: '0 22 * * 1-5' # Runs Monday-Friday at 10:00 PM UTC (after market close)
  workflow_dispatch: # Allows you to manually trigger it anytime via the website

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script to update data
        run: python update_data.py

      - name: Commit and push updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily automatic stock data update"
          file_pattern: data.json
